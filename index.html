<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>测试</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="wrap">

    <header>
    <div class="header-top">
      <h1>测试</h1>
      <label class="sort-label">
        排序
        <select id="sort-select">
          <option value="desc">时间倒序</option>
          <option value="asc">时间顺序</option>
        </select>
      </label>
    </div>

    <!-- 新增：标题下方一行字 -->
    <p class="header-note">这里放你想加的那行字。</p>

    <p id="meta">共 0 篇</p>
  </header>

  <ul class="toc" id="toc"></ul>

  <nav class="pager" id="pager" aria-label="分页" hidden></nav>

</div>

<script src="posts.js"></script>
<script>
(function () {
  'use strict';

  /* ---------- 配置：每页显示多少篇 ---------- */
  const PER_PAGE = 20;

  const tocEl      = document.getElementById('toc');
  const pagerEl    = document.getElementById('pager');
  const metaEl     = document.getElementById('meta');
  const sortSelect = document.getElementById('sort-select');

  /* ---------- 状态：page / sort ----------
     存在 URL hash 里，例如 index.html#page=2&sort=asc
     默认第 1 页、最新在前，此时 hash 为空 */
  let currentState = readState();

  function readState() {
    const params = new URLSearchParams(location.hash.slice(1));
    let page = parseInt(params.get('page'), 10);
    if (!Number.isFinite(page) || page < 1) page = 1;
    return {
      page: page,
      sort: params.get('sort') === 'asc' ? 'asc' : 'desc'
    };
  }

  /* 把状态写回 URL。file:// 下浏览器可能禁止 pushState，
     用 try/catch 包住——失败也不影响页面功能 */
  function writeState(state) {
    const params = new URLSearchParams();
    if (state.page > 1) params.set('page', String(state.page));
    if (state.sort === 'asc') params.set('sort', 'asc');
    const hash = params.toString() ? '#' + params.toString() : '#';
    if (location.hash === hash) return;
    try {
      history.pushState(null, '', hash);
    } catch (err) { /* 忽略 */ }
  }

  function setState(patch) {
    currentState = Object.assign({}, currentState, patch);
    writeState(currentState);
    render();
  }

  /* ---------- 工具：HTML 转义 ---------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* ---------- 排序 ---------- */
  function getSortedPosts(sort) {
    return (window.POSTS || []).slice().sort(function (a, b) {
      if (a.date === b.date) return 0;
      return sort === 'asc'
        ? a.date.localeCompare(b.date)   // 早 → 晚
        : b.date.localeCompare(a.date);  // 晚 → 早
    });
  }

  /* ---------- 页码序列：1 … 4 5 6 … 10 ---------- */
  function pageNumbers(current, total) {
    if (total <= 7) {
      const all = [];
      for (let i = 1; i <= total; i++) all.push(i);
      return all;
    }
    const pages = [1];
    if (current > 3) pages.push(null);              // null 表示省略号
    const from = Math.max(2, current - 1);
    const to   = Math.min(total - 1, current + 1);
    for (let i = from; i <= to; i++) pages.push(i);
    if (current < total - 2) pages.push(null);
    pages.push(total);
    return pages;
  }

  function hrefFor(page, sort) {
    const params = new URLSearchParams();
    if (page > 1) params.set('page', String(page));
    if (sort === 'asc') params.set('sort', 'asc');
    const s = params.toString();
    return s ? '#' + s : '#';
  }

  /* ---------- 渲染 ---------- */
  function render() {
    const all        = getSortedPosts(currentState.sort);
    const totalPages = Math.max(1, Math.ceil(all.length / PER_PAGE));

    // 页码越界（比如删了文章）时自动钳制，只改内存不改 URL
    if (currentState.page > totalPages) currentState.page = totalPages;
    const page = currentState.page;

    sortSelect.value = currentState.sort;

    // 当前页的文章
    const start     = (page - 1) * PER_PAGE;
    const pageItems = all.slice(start, start + PER_PAGE);

    // 目录列表
    tocEl.innerHTML = pageItems.map(function (post) {
      return (
        '<li class="toc-item">' +
'<a href="./article.html?p=' + encodeURIComponent(post.slug) + '">' +
            '<div class="toc-main">' +
              '<h2 class="toc-title">' + esc(post.title) + '</h2>' +
              (post.desc
                ? '<p class="toc-desc">' + esc(post.desc) + '</p>'
                : '') +
               '</div>' +
            '</a>' +
        '</li>'
      );
    }).join('');

    // 顶部统计
    if (all.length === 0) {
      metaEl.textContent = '还没有文章';
    } else if (totalPages > 1) {
      metaEl.textContent = '共 ' + all.length + ' 篇 · 第 ' + page + ' / ' + totalPages + ' 页';
    } else {
      metaEl.textContent = '共 ' + all.length + ' 篇';
    }

    renderPager(page, totalPages);
  }

  function renderPager(page, totalPages) {
    if (totalPages <= 1) {          // 只有一页就不显示分页条
      pagerEl.hidden = true;
      pagerEl.innerHTML = '';
      return;
    }
    pagerEl.hidden = false;

    const parts = [];

    // 上一页
    parts.push(page > 1
      ? '<a class="pager-btn" href="' + hrefFor(page - 1, currentState.sort) +
        '" data-page="' + (page - 1) + '" rel="prev">上一页</a>'
      : '<span class="pager-btn is-disabled">上一页</span>');

    // 页码
    pageNumbers(page, totalPages).forEach(function (n) {
      if (n === null) {
        parts.push('<span class="pager-gap">…</span>');
      } else if (n === page) {
        parts.push('<span class="pager-num is-current" aria-current="page">' + n + '</span>');
      } else {
        parts.push('<a class="pager-num" href="' + hrefFor(n, currentState.sort) +
          '" data-page="' + n + '">' + n + '</a>');
      }
    });

    // 下一页
    parts.push(page < totalPages
      ? '<a class="pager-btn" href="' + hrefFor(page + 1, currentState.sort) +
        '" data-page="' + (page + 1) + '" rel="next">下一页</a>'
      : '<span class="pager-btn is-disabled">下一页</span>');

    pagerEl.innerHTML = parts.join('');
  }

  /* ---------- 交互 ---------- */

  // 排序切换：换排序后回到第 1 页
  sortSelect.addEventListener('change', function () {
    setState({ sort: sortSelect.value, page: 1 });
  });

  // 分页点击：统一走 JS 状态，不依赖浏览器默认跳转
  pagerEl.addEventListener('click', function (e) {
    const link = e.target.closest('a[data-page]');
    if (!link) return;
    e.preventDefault();
    setState({ page: parseInt(link.dataset.page, 10) });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // 支持手改 URL 或浏览器前进/后退
  window.addEventListener('hashchange', function () {
    currentState = readState();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  /* ---------- 启动 ---------- */
  render();
})();
</script>
</body>
</html>
