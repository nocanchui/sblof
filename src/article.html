<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文章</title>
<link rel="stylesheet" href="./style.css">
<script src="marked.min.js"></script>
</head>
<body>
<div class="wrap">

  <a class="back-link" href="./index.html">← 返回目录</a>

  <div class="article-header">
    <h1 id="title">加载中…</h1>
  </div>

  <div class="article-body" id="body">
    <p class="article-status">加载中…</p>
  </div>

  <!-- 新增：文章内分页条 -->
  <nav class="article-pager" id="article-pager" aria-label="文章内分页" hidden></nav>
  <p class="back-to-top-wrap">
    <a href="#" id="back-to-top" class="back-to-top">↑ 回到顶部</a>
  </p>
</div>

<script src="posts.js"></script>
<script>
(function () {
  'use strict';

  // 让所有 md 文件的单个回车都渲染成 <br>
  marked.setOptions({ breaks: true });
  const titleEl = document.getElementById('title');
  const bodyEl  = document.getElementById('body');
  const pagerEl = document.getElementById('article-pager');

  const slug = new URLSearchParams(location.search).get('p') || '';
  const post = (window.POSTS || []).find(function (p) { return p.slug === slug; });

  if (!post) {
    document.title = '文章不存在';
    titleEl.textContent = '文章不存在';
    bodyEl.innerHTML =
      '<p class="article-status">没有找到这篇文章。<a href="./index.html">返回目录</a></p>';
    pagerEl.hidden = true;
    return;
  }

  document.title = post.title + ' — 存档';
  titleEl.textContent = post.title;

  /* ---------- 分页状态 ---------- */
  let pages = [];                              // 渲染后的 HTML 片段
  let currentPage = readPage();                // 从 #page=N 读取，默认 1

fetch('posts/' + encodeURIComponent(slug) + '.md', {
      headers: { 'Accept': 'text/plain' },
      cache: 'no-store'
    })
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(function (md) {
      if (typeof marked === 'undefined') throw new Error('marked 未加载');

        // ::: 标题 … :::   默认折叠
      // ::: open 标题 … :::  默认展开
      md = md.replace(
        /^:::[ \t]*(open[ \t]+)?(.+?)[ \t]*\r?\n([\s\S]*?)\r?\n:::[ \t]*$/gm,
        function (_, open, title, inner) {
          return '<details' + (open ? ' open' : '') + '>\n<summary>' +
                 title.trim() + '</summary>\n\n' +
                 inner.trim() + '\n\n</details>';
        }
      );

      let html = marked.parse(md);

      // 按 <!-- pagebreak --> 切分（大小写、空格都兼容）
      pages = html.split(/<!--\s*pagebreak\s*-->/i)
                  .map(function (s) { return s.trim(); })
                  .filter(function (s) { return s.length > 0; });

      if (pages.length === 0) {
        pages = ['<p class="article-status">（空文章）</p>'];
      }

      // 手改 URL 越界时钳制
      currentPage = Math.min(Math.max(1, currentPage), pages.length);
      renderPage();
    })
    .catch(function (err) {
      bodyEl.innerHTML =
        '<p class="article-status">文章加载失败（' + esc(err.message) + '）。</p>' +
        '<p class="article-status">如果是直接双击 HTML 打开的，请改用本地服务器。</p>';
    });

  /* ---------- 渲染当前页 ---------- */
  function renderPage() {
    bodyEl.innerHTML = pages[currentPage - 1];
    renderPager();
    writeHash(currentPage);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderPager() {
    const total = pages.length;

    if (total <= 1) {                          // 单页不显示翻页条
      pagerEl.hidden = true;
      pagerEl.innerHTML = '';
      return;
    }
    pagerEl.hidden = false;

    const parts = [];

    // 上一页
    parts.push(currentPage > 1
      ? '<a class="pager-btn" href="#" data-page="' + (currentPage - 1) + '" rel="prev">上一页</a>'
      : '<span class="pager-btn is-disabled">上一页</span>');

    // 页码（超过 7 页时中间折叠）
    pageNumbers(currentPage, total).forEach(function (n) {
      if (n === null) {
        parts.push('<span class="pager-gap">…</span>');
      } else if (n === currentPage) {
        parts.push('<span class="pager-num is-current" aria-current="page">' + n + '</span>');
      } else {
        parts.push('<a class="pager-num" href="#" data-page="' + n + '">' + n + '</a>');
      }
    });

    // 下一页
    parts.push(currentPage < total
      ? '<a class="pager-btn" href="#" data-page="' + (currentPage + 1) + '" rel="next">下一页</a>'
      : '<span class="pager-btn is-disabled">下一页</span>');

    // 附一行「第 x / y 页」
    parts.push('<span class="pager-info">第 ' + currentPage + ' / ' + total + ' 页</span>');

    pagerEl.innerHTML = parts.join('');
  }

  function pageNumbers(current, total) {
    if (total <= 7) {
      const all = [];
      for (let i = 1; i <= total; i++) all.push(i);
      return all;
    }
    const arr = [1];
    if (current > 3) arr.push(null);
    const from = Math.max(2, current - 1);
    const to   = Math.min(total - 1, current + 1);
    for (let i = from; i <= to; i++) arr.push(i);
    if (current < total - 2) arr.push(null);
    arr.push(total);
    return arr;
  }

  /* ---------- URL hash：#page=2 ---------- */
  function readPage() {
    const params = new URLSearchParams(location.hash.slice(1));
    const n = parseInt(params.get('page'), 10);
    return Number.isFinite(n) && n >= 1 ? n : 1;
  }

  function writeHash(n) {
    const params = new URLSearchParams(location.hash.slice(1));
    if (n > 1) params.set('page', String(n));
    else params.delete('page');
    const hash = params.toString() ? '#' + params.toString() : '#';
    if (location.hash === hash) return;
    try { history.pushState(null, '', hash); } catch (e) {}
  }

  /* ---------- 交互 ---------- */
    document.getElementById('back-to-top').addEventListener('click', function (e) {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  pagerEl.addEventListener('click', function (e) {
    const link = e.target.closest('a[data-page]');
    if (!link) return;
    e.preventDefault();
    currentPage = parseInt(link.dataset.page, 10);
    renderPage();
  });

  // 支持浏览器前进/后退、手改 hash
  window.addEventListener('hashchange', function () {
    const n = readPage();
    if (n !== currentPage && n >= 1 && n <= pages.length) {
      currentPage = n;
      renderPage();
    }
  });

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
})();
</script>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="57024ad2-239e-4ffa-a4f1-48c6169afa22"></script>
</body>
</html>
